<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="__APP_ICON__" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>__APP_NAME__</title>
    <meta name="application-name" content="__APP_NAME__" />
    <meta name="apple-mobile-web-app-title" content="__APP_NAME__" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      // Load Telegram Web App script only inside Telegram environment
      (function () {
        var isTelegram =
          window.TelegramWebviewProxy ||
          location.hash.indexOf('tgWebApp') !== -1 ||
          location.search.indexOf('tgWebApp') !== -1;
        if (isTelegram) {
          var s = document.createElement('script');
          s.src = 'https://telegram.org/js/telegram-web-app.js';
          s.async = true;
          document.head.appendChild(s);
        }
      })();
    </script>
    <style>
      /* Фон первой отрисовки — до того, как приедет CSS приложения. Светлый
         вариант соответствует champagne-200 из globals.css (.light body).
         Специфичность обоих правил обязана оставаться (0,0,1): фон темы в
         globals.css задаёт `.light body` (0,1,1) операторским цветом, а
         @layer base в Tailwind v3 — не настоящий каскадный слой. Более
         специфичный селектор здесь (например `html.light body`) навсегда
         перекрывал бы кастомный светлый фон. :where() обнуляет вклад класса. */
      body {
        background-color: #0a0f1a;
      }
      :where(html.light) body {
        background-color: #f7e7ce;
      }
    </style>
    <script>
      // Тема ДО первой отрисовки. useTheme вешает класс в useEffect, то есть уже
      // после неё, а тут зашиты class="dark" и тёмный фон — пользователь светлой
      // темы видел тёмную вспышку. Порядок разрешения повторяет useTheme:
      // сохранённый выбор -> системная тема -> тёмная. Ветку Telegram намеренно
      // не трогаем: colorScheme доступен только после init() SDK, а внутри
      // Telegram фон и так задаёт клиент.
      (function () {
        try {
          var enabled = { dark: true, light: true };
          try {
            var rawEnabled = localStorage.getItem('cabinet-enabled-themes');
            if (rawEnabled) {
              var parsed = JSON.parse(rawEnabled);
              if (parsed && typeof parsed === 'object') {
                enabled = { dark: parsed.dark !== false, light: parsed.light !== false };
              }
            }
          } catch (e) {}
          if (!enabled.dark && !enabled.light) enabled = { dark: true, light: true };

          var stored = null;
          try {
            stored = localStorage.getItem('cabinet-theme');
          } catch (e) {}

          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = enabled[stored] ? stored : enabled.dark ? 'dark' : 'light';
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches && enabled.light) {
            theme = 'light';
          } else {
            theme = enabled.dark ? 'dark' : 'light';
          }

          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          if (theme === 'light') {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f7e7ce');
          }
        } catch (e) {
          // Хранилище заблокировано — остаётся тёмная тема из разметки.
        }
      })();
    </script>
    <script>
      // Бренд до первой отрисовки. Имя и логотип приходят с бэкенда уже после
      // загрузки JS, и на медленной сети вкладка успевает показать значения из
      // сборки (__APP_NAME__ и монограмму). Повторные визиты берут подсказку,
      // которую записал useDocumentBranding (ключ = STORAGE_KEYS.BRAND_HINT).
      (function () {
        try {
          var raw = localStorage.getItem('cabinet-brand-hint');
          if (!raw) return;
          var hint = JSON.parse(raw);
          if (!hint || typeof hint.name !== 'string') return;
          var name = hint.name.trim();
          if (name) {
            document.title = name;
            var metas = document.querySelectorAll(
              'meta[name="application-name"], meta[name="apple-mobile-web-app-title"]'
            );
            for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', name);
          }
          if (typeof hint.icon === 'string' && hint.icon.indexOf('data:image/') === 0) {
            var icon = document.querySelector('link[rel="icon"]');
            if (icon) icon.setAttribute('href', hint.icon);
          }
        } catch (e) {
          // Хранилище заблокировано — остаются значения сборки.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
